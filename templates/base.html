<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - {% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .sidebar-container {
      min-height: 100vh;
      background-color: #fff;
      border-right: 1px solid #dee2e6;
      padding: 20px;
    }
    .sidebar-nav .nav-link {
      color: #007bff;
      border: 1px solid #dee2e6;
      margin-bottom: -1px; /* Щоб рамки не подвоювались */
      padding: 10px 20px;
    }
    .sidebar-nav .nav-link:first-child {
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }
    .sidebar-nav .nav-link:last-child {
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
    }
    .main-content {
      padding: 30px;
      background-color: #fff;
      min-height: 100vh;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">

    <div class="col-md-3 col-lg-2 p-0">
      <div class="sidebar-container">
        <nav class="nav flex-column sidebar-nav">
          <a class="nav-link" href="{% url 'todo:index' %}">Home</a>
          <a class="nav-link" href="{% url 'todo:tag-list' %}">Tags</a>
        </nav>
      </div>
    </div>

    <div class="col-md-9 col-lg-10 main-content">
      {% block content %}{% endblock %}
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
