{% extends "base.html" %}

{% block content %}
  <h1>Delete task</h1>
  <p>Are you sure you want to delete the task: <strong>{{ task.content }}</strong>?</p>

  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'todo:index' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
