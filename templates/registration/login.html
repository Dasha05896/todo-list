{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h2 class="mb-4">Login</h2>
        <div class="card card-body border-0 shadow-sm">
            <form method="post" action="">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
